name: Build MatsyaOS ISO

on:
  workflow_dispatch:
    inputs:
      iso_version:
        description: 'ISO version tag (e.g., 1.0, 2.0)'
        required: false
        default: '1.0'
        type: string
  push:
    branches: [master]

concurrency:
  group: matsya-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined

    steps:
      - name: Install ISO build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            archiso arch-install-scripts squashfs-tools libisoburn mtools syslinux grub \
            git wget github-cli && \
          pacman -Scc --noconfirm

      - name: Checkout MatsyaOS
        uses: actions/checkout@v7
        with:
          repository: MatsyaOs/MatsyaOS
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: MatsyaOS

      - name: Checkout submodules
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}/MatsyaOS"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 1

      - name: Strip local repos from pacman.conf
        run: |
          CONF="${GITHUB_WORKSPACE}/MatsyaOS/matsya-iso/profiles/matsya/pacman.conf"
          sed -i '/^Server\s*=\s*file:\/\//d' "$CONF"
          echo "=== Sanitized pacman.conf ==="
          grep -n '^\s*Server\s*=' "$CONF" || echo "WARNING: No Server entries!"

      - name: Set ISO version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.iso_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ISO
        run: |
          set -e
          mkdir -p /tmp/iso-work "${GITHUB_WORKSPACE}/iso-output"
          rm -rf /tmp/iso-work/*

          mkarchiso -v -w /tmp/iso-work \
            -o "${GITHUB_WORKSPACE}/iso-output" \
            "${GITHUB_WORKSPACE}/MatsyaOS/matsya-iso/profiles/matsya"

          echo "=== ISO BUILD COMPLETE ==="
          ls -lh "${GITHUB_WORKSPACE}/iso-output"/

      - name: Generate SHA512 checksum
        run: |
          cd "${GITHUB_WORKSPACE}/iso-output"
          for f in *.iso; do
            sha512sum "$f" > "$f.sha512"
          done
          cat *.sha512

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: MatsyaOS-ISO-${{ steps.version.outputs.version }}
          path: ${{ github.workspace }}/iso-output/*.iso
          if-no-files-found: error

      - name: Upload ISO checksum
        uses: actions/upload-artifact@v7
        with:
          name: MatsyaOS-ISO-${{ steps.version.outputs.version }}-sha512
          path: ${{ github.workspace }}/iso-output/*.sha512
          if-no-files-found: warn

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ISO_FILE=$(ls "${GITHUB_WORKSPACE}/iso-output"/*.iso | head -1)
          ISO_NAME=$(basename "$ISO_FILE")
          SHA=$(cat "${ISO_FILE}.sha512" | awk '{print $1}')

          cd "${GITHUB_WORKSPACE}/MatsyaOS"
          gh release create "$TAG" \
            --repo MatsyaOs/MatsyaOS \
            --title "MatsyaOS ${VERSION}" \
            --notes "MatsyaOS ISO build ${VERSION}

          SHA512: \`${SHA}\`

          > **Note:** The ISO file (${ISO_NAME}) exceeds GitHub's 2 GB release asset limit.
          > Download it from the **MatsyaOS-ISO-${VERSION}** artifact in the [GitHub Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            "${GITHUB_WORKSPACE}/iso-output"/*.sha512
