name: Build MatsyaOS ISO

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'matsya-iso/profiles/**'
      - 'matsya-iso/archuseriso/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso arch-install-scripts grub git wget squashfs-tools libisoburn mtools syslinux

      - name: Checkout MatsyaOS
        uses: actions/checkout@v4
        with:
          repository: MatsyaOs/MatsyaOS
          fetch-depth: 1
          path: MatsyaOS

      - name: Checkout matsyaos-repo
        uses: actions/checkout@v4
        with:
          repository: MatsyaOs/matsyaos-repo
          path: matsyaos-repo

      - name: Debug paths
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"
          ls -la "${GITHUB_WORKSPACE}/"
          echo "---"
          ls -la "${GITHUB_WORKSPACE}/MatsyaOS/" 2>/dev/null || echo "No MatsyaOS dir"
          echo "---"
          ls -la "${GITHUB_WORKSPACE}/matsyaos-repo/" 2>/dev/null || echo "No matsyaos-repo dir"

      - name: Build ISO
        run: |
          # Fix repo path
          cd "${GITHUB_WORKSPACE}"
          PROFILE_DIR="${GITHUB_WORKSPACE}/MatsyaOS/matsya-iso/profiles/matsya"
          REPO_DIR="${GITHUB_WORKSPACE}/matsyaos-repo/x86_64"

          sed -i "s|file:///home/mister/matsyaos-repo/x86_64/|file://${REPO_DIR}/|g" "${PROFILE_DIR}/pacman.conf"

          # Debug PATH and override
          echo "PATH=$PATH"
          which pacstrap || echo "pacstrap not in PATH"

          # Override pacstrap - install packages using pacman --root directly (no mount needed)
          cat > /tmp/pacstrap-override << 'EOF'
#!/bin/bash
set -e
echo "PACSTRAP_OVERRIDE: args=$*" >&2
NEWROOT=""
PACMAN_CONF=""
PKGS=()
while [[ $# -gt 0 ]]; do
  case "$1" in
    -C) PACMAN_CONF="$2"; shift 2 ;;
    -c|-G|-M|-U) shift ;;
    --) shift; NEWROOT="$1"; shift ;;
    *) if [[ -z "$NEWROOT" ]]; then NEWROOT="$1"; else PKGS+=("$1"); fi; shift ;;
  esac
done
if [[ -z "$NEWROOT" || -z "$PACMAN_CONF" ]]; then
  echo "PACSTRAP_OVERRIDE ERROR: Usage" >&2
  exit 1
fi
mkdir -p "$NEWROOT"/{dev,proc,sys,run,etc/pacman.d,var/{lib/pacman,cache/pacman/pkg,log}}
cp "$PACMAN_CONF" "$NEWROOT/etc/pacman.conf"
exec pacman --root="$NEWROOT" --config="$PACMAN_CONF" --cachedir=/var/cache/pacman/pkg --noconfirm -Sy "${PKGS[@]}"
EOF
          install -m 755 /tmp/pacstrap-override /usr/local/bin/pacstrap
          # Verify override is first in PATH
          hash -r
          echo "pacstrap location: $(type -p pacstrap)"

          cd "${GITHUB_WORKSPACE}/MatsyaOS/matsya-iso"
          rm -rf work out
          ./archuseriso/aui-mkiso "${PROFILE_DIR}" /tmp/iso-output 2>&1

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MatsyaOS-ISO
          path: /tmp/iso-output/*.iso
          if-no-files-found: error
