name: Build MatsyaOS ISO

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso arch-install-scripts grub git wget squashfs-tools libisoburn mtools syslinux

      - name: Checkout MatsyaOS
        uses: actions/checkout@v4
        with:
          repository: MatsyaOs/MatsyaOS
          fetch-depth: 1
          path: MatsyaOS

      - name: Checkout matsyaos-repo
        uses: actions/checkout@v4
        with:
          repository: MatsyaOs/matsyaos-repo
          path: matsyaos-repo

      - name: Debug paths
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"
          ls -la "${GITHUB_WORKSPACE}/"
          echo "---"
          ls -la "${GITHUB_WORKSPACE}/MatsyaOS/" 2>/dev/null || echo "No MatsyaOS dir"
          echo "---"
          ls -la "${GITHUB_WORKSPACE}/matsyaos-repo/" 2>/dev/null || echo "No matsyaos-repo dir"

      - name: Build ISO
        run: |
          # Fix repo path
          cd "${GITHUB_WORKSPACE}"
          PROFILE_DIR="${GITHUB_WORKSPACE}/MatsyaOS/matsya-iso/profiles/matsya"
          REPO_DIR="${GITHUB_WORKSPACE}/matsyaos-repo/x86_64"

          sed -i "s|file:///home/mister/matsyaos-repo/x86_64/|file://${REPO_DIR}/|g" "${PROFILE_DIR}/pacman.conf"

          # Debug PATH and override
          echo "PATH=$PATH"
          which pacstrap || echo "pacstrap not in PATH"

          # Copy pacstrap override (avoids mount calls that fail in Docker)
          cp "${GITHUB_WORKSPACE}/MatsyaOS/.github/scripts/pacstrap-override" /usr/local/bin/pacstrap
          # Verify override is first in PATH
          hash -r
          echo "pacstrap location: $(type -p pacstrap)"

          cd "${GITHUB_WORKSPACE}/MatsyaOS/matsya-iso"
          rm -rf work out
          ./archuseriso/aui-mkiso "${PROFILE_DIR}" /tmp/iso-output 2>&1

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MatsyaOS-ISO
          path: /tmp/iso-output/*.iso
          if-no-files-found: error
