name: Build MatsyaOS ISO

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'matsya-iso/profiles/**'
      - 'matsya-iso/archuseriso/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso arch-install-scripts grub git wget squashfs-tools libisoburn mtools syslinux

      - name: Checkout MatsyaOS
        uses: actions/checkout@v4
        with:
          repository: MatsyaOs/MatsyaOS
          fetch-depth: 1
          path: MatsyaOS

      - name: Checkout matsyaos-repo
        uses: actions/checkout@v4
        with:
          repository: MatsyaOs/matsyaos-repo
          path: matsyaos-repo

      - name: Build ISO
        run: |
          ISO_DIR="${GITHUB_WORKSPACE}/MatsyaOS"
          PROFILE_DIR="${ISO_DIR}/matsya-iso/profiles/matsya"
          REPO_DIR="$(dirname ${GITHUB_WORKSPACE})/matsyaos-repo/x86_64"
          sed -i "s|file:///home/mister/matsyaos-repo/x86_64/|file://${REPO_DIR}/|g" "${PROFILE_DIR}/pacman.conf"

          cd "${ISO_DIR}/matsya-iso"
          ./archuseriso/aui-mkiso "${PROFILE_DIR}" /tmp/iso-output

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MatsyaOS-ISO
          path: /tmp/iso-output/*.iso
          if-no-files-found: error
