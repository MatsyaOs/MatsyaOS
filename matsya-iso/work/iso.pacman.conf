[options]
CacheDir = /var/cache/pacman/pkg/ 
HookDir = /iso/work/x86_64/airootfs/etc/pacman.d/hooks/
GPGDir = /etc/pacman.d/gnupg/
HoldPkg = pacman
HoldPkg = glibc
Architecture = x86_64
ParallelDownloads = 5
CleanMethod = KeepInstalled
SigLevel = PackageRequired
SigLevel = PackageTrustedOnly
SigLevel = DatabaseOptional
SigLevel = DatabaseTrustedOnly
LocalFileSigLevel = PackageOptional
LocalFileSigLevel = PackageTrustedOnly
[core]
Usage = All
Server = https://fastly.mirror.pkgbuild.com/core/os/x86_64
Server = https://geo.mirror.pkgbuild.com/core/os/x86_64
[extra]
Usage = All
Server = https://fastly.mirror.pkgbuild.com/extra/os/x86_64
Server = https://geo.mirror.pkgbuild.com/extra/os/x86_64
[community]
Usage = All
Server = https://fastly.mirror.pkgbuild.com/community/os/x86_64
Server = https://geo.mirror.pkgbuild.com/community/os/x86_64
[chaotic-aur]
Usage = All
Server = https://geo-mirror.chaotic.cx/chaotic-aur/x86_64
[matsya]
Usage = All
SigLevel = PackageOptional
SigLevel = PackageTrustAll
SigLevel = DatabaseOptional
SigLevel = DatabaseTrustAll
